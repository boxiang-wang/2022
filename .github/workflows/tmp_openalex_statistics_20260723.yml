name: Temporary OpenAlex statistics bibliography package

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out generated files
        uses: actions/checkout@v4
        with:
          ref: tmp-openalex-statistics-20260723

      - name: Validate generated files
        run: |
          test -s statistics_top_1000_openalex.csv
          test -s statistics_top_1000_methodology.json
          test "$(($(wc -l < statistics_top_1000_openalex.csv)-1))" -eq 1000

      - name: Upload generated bibliography
        uses: actions/upload-artifact@v4
        with:
          name: statistics-top-1000-openalex
          path: |
            statistics_top_1000_openalex.csv
            statistics_top_1000_methodology.json
            statistics_top_1000_ready.txt
          if-no-files-found: error
          retention-days: 1
