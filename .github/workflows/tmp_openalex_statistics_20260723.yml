name: Temporary OpenAlex statistics bibliography build

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-openalex-statistics-20260723
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HTTP dependency
        run: python -m pip install --quiet requests

      - name: Query OpenAlex and build CSV
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          cat > /tmp/build_openalex.py <<'PY'
          import csv
          import json
          import os
          import re
          import time
          from datetime import datetime, timezone

          import requests

          ENDPOINT = "https://api.openalex.org/works"
          SUBFIELD_ID = "2613"
          SUBFIELD_NAME = "Statistics and Probability"
          FILTER = (
              "primary_topic.subfield.id:2613,"
              "has_doi:true,"
              "is_retracted:false,"
              "type:article"
          )
          SELECT = (
              "id,doi,display_name,publication_year,publication_date,"
              "cited_by_count,open_access,primary_location,primary_topic,"
              "type,is_retracted"
          )
          TARGET = 1000
          MAX_CALLS = 50
          RETRIEVED_AT = datetime.now(timezone.utc).replace(microsecond=0).isoformat()

          def normalize_doi(value):
              if not value:
                  return None
              value = str(value).strip()
              value = re.sub(r"^https?://(?:dx\.)?doi\.org/", "", value, flags=re.I)
              value = re.sub(r"^doi:\s*", "", value, flags=re.I)
              value = value.strip().lower()
              return value or None

          session = requests.Session()
          session.headers.update({
              "User-Agent": "temporary-statistics-bibliography/1.0",
              "Accept": "application/json",
          })

          api_key = os.environ.get("OPENALEX_API_KEY", "").strip()
          cursor = "*"
          rows = []
          seen_dois = set()
          calls = 0
          total_matches = None

          while len(rows) < TARGET and cursor and calls < MAX_CALLS:
              params = {
                  "filter": FILTER,
                  "sort": "cited_by_count:desc",
                  "per_page": 100,
                  "cursor": cursor,
                  "select": SELECT,
              }
              if api_key:
                  params["api_key"] = api_key

              last_error = None
              for attempt in range(6):
                  response = session.get(ENDPOINT, params=params, timeout=60)
                  if response.status_code == 200:
                      break
                  last_error = f"HTTP {response.status_code}: {response.text[:1000]}"
                  if response.status_code in {429, 500, 502, 503, 504}:
                      time.sleep(min(30, 2 ** attempt))
                      continue
                  raise RuntimeError(last_error)
              else:
                  raise RuntimeError(last_error or "OpenAlex request failed")

              payload = response.json()
              calls += 1
              meta = payload.get("meta") or {}
              if total_matches is None:
                  total_matches = meta.get("count")

              works = payload.get("results") or []
              if not works:
                  break

              for work in works:
                  doi = normalize_doi(work.get("doi"))
                  if not doi or doi in seen_dois:
                      continue

                  topic = work.get("primary_topic") or {}
                  subfield = topic.get("subfield") or {}
                  subfield_id = str(subfield.get("id") or "")
                  if subfield_id and not subfield_id.rstrip("/").endswith("/" + SUBFIELD_ID) and subfield_id != SUBFIELD_ID:
                      continue

                  oa = work.get("open_access") or {}
                  location = work.get("primary_location") or {}
                  source = location.get("source") or {}
                  is_oa = bool(oa.get("is_oa"))

                  seen_dois.add(doi)
                  rows.append({
                      "rank": len(rows) + 1,
                      "title": work.get("display_name") or "",
                      "doi": doi,
                      "doi_url": f"https://doi.org/{doi}",
                      "publication_year": work.get("publication_year"),
                      "publication_date": work.get("publication_date") or "",
                      "journal_or_venue": source.get("display_name") or "",
                      "cited_by_count": work.get("cited_by_count") or 0,
                      "open_access": "Yes" if is_oa else "No",
                      "oa_status": oa.get("oa_status") or ("open" if is_oa else "closed"),
                      "oa_url": oa.get("oa_url") or "",
                      "openalex_id": work.get("id") or "",
                      "primary_topic": topic.get("display_name") or "",
                      "primary_subfield": subfield.get("display_name") or SUBFIELD_NAME,
                      "work_type": work.get("type") or "",
                      "retrieved_at_utc": RETRIEVED_AT,
                  })
                  if len(rows) >= TARGET:
                      break

              cursor = meta.get("next_cursor")
              time.sleep(0.25)

          if len(rows) < TARGET:
              raise RuntimeError(
                  f"Only collected {len(rows)} unique DOI-bearing records after {calls} API calls."
              )

          fields = [
              "rank", "title", "doi", "doi_url", "publication_year",
              "publication_date", "journal_or_venue", "cited_by_count",
              "open_access", "oa_status", "oa_url", "openalex_id",
              "primary_topic", "primary_subfield", "work_type",
              "retrieved_at_utc",
          ]
          with open("statistics_top_1000_openalex.csv", "w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          summary = {
              "method": "Top 1,000 by OpenAlex cited_by_count",
              "scope": "OpenAlex primary topic subfield Statistics and Probability (ID 2613)",
              "filters": FILTER,
              "requirements": "DOI present; type=article; not retracted",
              "deduplication": "Normalized DOI",
              "open_access_definition": "OpenAlex open_access.is_oa; status and URL copied from OpenAlex",
              "retrieved_at_utc": RETRIEVED_AT,
              "api_calls": calls,
              "openalex_total_matching_records": total_matches,
              "records_exported": len(rows),
              "lowest_citation_count_in_export": rows[-1]["cited_by_count"],
          }
          with open("statistics_top_1000_methodology.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2)

          with open("statistics_top_1000_ready.txt", "w", encoding="utf-8") as f:
              f.write(json.dumps(summary, ensure_ascii=False))

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
          python /tmp/build_openalex.py

      - name: Commit generated files to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statistics_top_1000_openalex.csv statistics_top_1000_methodology.json statistics_top_1000_ready.txt
          git commit -m "Generate temporary OpenAlex statistics bibliography"
          git push origin "HEAD:tmp-openalex-statistics-20260723"
